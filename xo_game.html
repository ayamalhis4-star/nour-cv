<!DOCTYPE html>
	<head>
		<style>
			input.b{
				width: 100px;
				height: 100px;
				background-color: pink;
				font-size: 30pt;
			}
		</style>
		<script>
			var player;
			var gameArray=new Array(3);
			for (i=0;i<=2; i++)
				gameArray[i]=new Array(3);

			function play(buttonId){
				if(buttonId=="b00"){
					if(player==1){
						document.getElementById("b00").value="X";
						gameArray[0][0]="X";
						player=2;}
					else{
						document.getElementById("b00").value="O";
						gameArray[0][0]="O";
						player=1;}
					document.getElementById("b00").disabled=true;
				}
				if(buttonId=="b01"){
					if(player==1){
						document.getElementById("b01").value="X";
						gameArray[0][1]="X";
						player=2;}
					else{
						document.getElementById("b01").value="O";
						gameArray[0][1]="O";
						player=1;}
					document.getElementById("b01").disabled=true;
				}
				if(buttonId=="b02"){
					if(player==1){
						document.getElementById("b02").value="X";
						gameArray[0][2]="X";
						player=2;}
					else{
						document.getElementById("b02").value="O";
						gameArray[0][2]="O";
						player=1;}
					document.getElementById("b02").disabled=true;
				}
				if(buttonId=="b10"){
					if(player==1){
						document.getElementById("b10").value="X";
						gameArray[1][0]="X";
						player=2;}
					else{
						document.getElementById("b10").value="O";
						gameArray[1][0]="O";
						player=1;}
					document.getElementById("b10").disabled=true;
				}
				if(buttonId=="b11"){
					if(player==1){
						document.getElementById("b11").value="X";
						gameArray[1][1]="X";
						player=2;}
					else{
						document.getElementById("b11").value="O";
						gameArray[1][1]="O";
						player=1;}
					document.getElementById("b11").disabled=true;
				}
				if(buttonId=="b12"){
					if(player==1){
						document.getElementById("b12").value="X";
						gameArray[1][2]="X";
						player=2;}
					else{
						document.getElementById("b12").value="O";
						gameArray[1][2]="O";
						player=1;}
					document.getElementById("b12").disabled=true;
				}
				if(buttonId=="b20"){
					if(player==1){
						document.getElementById("b20").value="X";
						gameArray[2][0]="X";
						player=2;}
					else{
						document.getElementById("b20").value="O";
						gameArray[2][0]="O";
						player=1;}
					document.getElementById("b20").disabled=true;
				}
				if(buttonId=="b21"){
					if(player==1){
						document.getElementById("b21").value="X";
						gameArray[2][1]="X";
						player=2;}
					else{
						document.getElementById("b21").value="O";
						gameArray[2][1]="O";
						player=1;}
					document.getElementById("b21").disabled=true;
				}
				if(buttonId=="b22"){
					if(player==1){
						document.getElementById("b22").value="X";
						gameArray[2][2]="X";
						player=2;}
					else{
						document.getElementById("b22").value="O";
						gameArray[2][2]="O";
						player=1;}
					document.getElementById("b22").disabled=true;
				}
				checkGame();
			}

			function checkGame(){
				if(gameArray[0][0]==gameArray[0][1] && gameArray[0][1]==gameArray[0][2] && gameArray[0][2]!=""){
					alert("Player: "+player+" wins!");
					if(prompt("To play again, enter 0")==0)
						startGame();
				}
				if(gameArray[1][0]==gameArray[1][1] && gameArray[1][1]==gameArray[1][2] && gameArray[1][2]!=""){
					alert("Player: "+player+" wins!");
					if(prompt("To play again, enter 0")==0)
						startGame();
				}
				if(gameArray[2][0]==gameArray[2][1] && gameArray[2][1]==gameArray[2][2] && gameArray[2][2]!=""){
					alert("Player: "+player+" wins!");
					if(prompt("To play again, enter 0")==0)
						startGame();
				}
				if(gameArray[0][0]==gameArray[1][0] && gameArray[1][0]==gameArray[2][0] && gameArray[2][0]!=""){
					alert("Player: "+player+" wins!");
					if(prompt("To play again, enter 0")==0)
						startGame();
				}
				if(gameArray[0][1]==gameArray[1][1] && gameArray[1][1]==gameArray[2][1] && gameArray[2][1]!=""){
					alert("Player: "+player+" wins!");
					if(prompt("To play again, enter 0")==0)
						startGame();
				}
				if(gameArray[0][2]==gameArray[1][2] && gameArray[1][2]==gameArray[2][2] && gameArray[2][2]!=""){
					alert("Player: "+player+" wins!");
					if(prompt("To play again, enter 0")==0)
						startGame();
				}
				if(gameArray[0][0]==gameArray[1][1] && gameArray[1][1]==gameArray[2][2] && gameArray[2][2]!=""){
					alert("Player: "+player+" wins!");
					if(prompt("To play again, enter 0")==0)
						startGame();
				}
				if(gameArray[0][2]==gameArray[1][1] && gameArray[1][1]==gameArray[2][0] && gameArray[2][0]!=""){
					alert("Player: "+player+" wins!");
					if(prompt("To play again, enter 0")==0)
						startGame();
				}

			}

			function startGame(){
				player=1;
				document.getElementById("b00").value="";
				document.getElementById("b01").value="";
				document.getElementById("b02").value="";
				document.getElementById("b10").value="";
				document.getElementById("b11").value="";
				document.getElementById("b12").value="";
				document.getElementById("b20").value="";
				document.getElementById("b21").value="";
				document.getElementById("b22").value="";

				document.getElementById("b00").disabled=false;
				document.getElementById("b01").disabled=false;
				document.getElementById("b02").disabled=false;
				document.getElementById("b10").disabled=false;
				document.getElementById("b11").disabled=false;
				document.getElementById("b12").disabled=false;
				document.getElementById("b20").disabled=false;
				document.getElementById("b21").disabled=false;
				document.getElementById("b22").disabled=false;

				for(i=0; i<=2; i++)
					for(j=0; j<=2; j++)
						gameArray[i][j]="";
			}
		</script>
	</head>
	<body onLoad="startGame();">
		<center>
		<h1 style="color: pink; font-size: 30pt; text-shadow: silver 3px 3px;">X-O Game</h1>
		<table>
			<tr><td><input type="button" class="b" id="b00" onClick="play(this.id);"></td><td><input type="button" class="b" id="b01" onClick="play(this.id);"></td><td><input type="button" class="b" id="b02" onClick="play(this.id);"></td></tr>
			<tr><td><input type="button" class="b" id="b10" onClick="play(this.id);"></td><td><input type="button" class="b" id="b11" onClick="play(this.id);"></td><td><input type="button" class="b" id="b12" onClick="play(this.id);"></td></tr>
			<tr><td><input type="button" class="b" id="b20" onClick="play(this.id);"></td><td><input type="button" class="b" id="b21" onClick="play(this.id);"></td><td><input type="button" class="b" id="b22" onClick="play(this.id);"></td></tr>
		</table>
		</center>
	</body>
</html>
