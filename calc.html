<!DOCTYPE html>
	<head>
		<style>
			input{
				font-family: DS-Digital;
				font-weight: bold;
				font-size: 18pt;
			}

			input.b{
				width: 60px;
				height: 60px;
				background-color: black;
				color: white;
			}
		</style>
		<script>
			function updateDisplay(s){
				document.getElementById("display").value+=s;
			}

			function clearDisplay(){
				document.getElementById("display").value="";
			}

			function calc(){
				document.getElementById("display").value=eval(document.getElementById("display").value);
			}
		</script>
	</head>
	<body>
		<table>
			<tr><td colspan="4"><input type="text" id="display"></td></tr>
			<tr><td><input type="button" value="7" class="b" onClick="updateDisplay(this.value);"></td><td><input type="button" value="8" class="b" onClick="updateDisplay(this.value);"></td><td><input type="button" value="9" class="b" onClick="updateDisplay(this.value);"></td><td><input type="button" value="+" class="b" onClick="updateDisplay(this.value);"></td></tr>
			<tr><td><input type="button" value="4" class="b" onClick="updateDisplay(this.value);"></td><td><input type="button" value="5" class="b" onClick="updateDisplay(this.value);"></td><td><input type="button" value="6" class="b" onClick="updateDisplay(this.value);"></td><td><input type="button" value="-" class="b" onClick="updateDisplay(this.value);"></td></tr>
			<tr><td><input type="button" value="1" class="b" onClick="updateDisplay(this.value);"></td><td><input type="button" value="2" class="b" onClick="updateDisplay(this.value);"></td><td><input type="button" value="3" class="b" onClick="updateDisplay(this.value);"></td><td><input type="button" value="*" class="b" onClick="updateDisplay(this.value);"></td></tr>
			<tr><td><input type="button" value="C" class="b" onClick="clearDisplay();"></td><td><input type="button" value="." class="b" onClick="updateDisplay(this.value);"></td><td><input type="button" value="=" class="b" onClick="calc();"></td><td><input type="button" value="/" class="b" onClick="updateDisplay(this.value);"></td></tr>
		</table>
	</body>
</html>
